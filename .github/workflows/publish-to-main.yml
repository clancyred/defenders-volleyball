name: Publish branch to the live site

on:
  push:
    branches-ignore: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the
      # Pages deploy explicitly after main is updated.
      - name: Merge this branch into main and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898978+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            if git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
              echo "$BRANCH is already on main."
              exit 0
            fi
            git merge "origin/$BRANCH" -m "Publish $BRANCH to the live site"
            if git push origin HEAD:main; then
              gh workflow run deploy-pages.yml --ref main
              exit 0
            fi
            echo "main moved during the merge; retrying (attempt $attempt)."
          done
          exit 1
