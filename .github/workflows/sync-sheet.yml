name: Rebuild data from stat sheet

on:
  push:
    branches: [main]
    paths: [source/varsity_stat_workbook.xlsx]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sheet-sync
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl

      # Always build from the newest workbook on main. If main moves while building
      # (another sheet push or a duplicate run), start over from it instead of rebasing.
      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the deploy explicitly.
      - name: Build, commit, and deploy if the stats changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898978+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python scripts/import_google_workbook.py
            python scripts/build_data.py
            if git diff --quiet -- data.js; then
              echo "Site data already matches the newest workbook."
              exit 0
            fi
            git add data.js volleyball_stats.xlsx
            git commit --quiet -m "Update stats from Google Sheet"
            if git push origin HEAD:main; then
              gh workflow run deploy-pages.yml --ref main
              exit 0
            fi
            echo "main moved during the build; rebuilding from the latest workbook (attempt $attempt)."
          done
          exit 1
